[package]
name = "kori"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
authors = ["DarkZmaj"]
license = "MIT"
description = "Kori: a multi-server, panel-based Discord ticket and support bot"
repository = "https://github.com/darkzmaj/Kori-Discord-Bot"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "utils", "rustls_backend", "chrono"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
percent-encoding = "2"

[profile.release]
strip = true

# serenity 0.12.5 plus two raw fields so modal FileUpload submissions (Label + resolved attachments) survive parsing,
# and tokio-tungstenite 0.24 so the gateway uses a patched rustls 0.23 (0.21 pulled in rustls 0.22 with RustSec advisories).
[patch.crates-io]
serenity = { path = "vendor/serenity" }
