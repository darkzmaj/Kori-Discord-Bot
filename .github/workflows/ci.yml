name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh
      - name: docker-compose.yml is valid
        run: DISCORD_TOKEN=x docker compose config --quiet

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake test:ruby
      - run: bundle exec rake commands:sync:dry

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kori:ci .
      - name: Image starts and fails cleanly without a token
        run: |
          out=$(docker run --rm kori:ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'DISCORD_TOKEN is required'
      - name: Ruby tooling runs inside the image
        run: docker run --rm kori:ci bundle exec rake commands:sync:dry
